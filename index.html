<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>팀 업무 지식 · 연결</title><style>body{font:16px/1.6 system-ui,sans-serif;background:#f7f9fc;color:#202a37;margin:0}main{max-width:960px;margin:auto;padding:50px 24px}h1{margin-bottom:0}.lead{color:#536172}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin:28px 0}article{background:white;border:1px solid #d9e1ea;border-radius:12px;padding:22px}label{display:block;margin-top:14px;font-weight:600}input{box-sizing:border-box;width:100%;padding:10px;margin:5px 0 15px;border:1px solid #aab6c3;border-radius:5px;font:inherit}button{background:#214f83;color:white;border:0;border-radius:5px;padding:10px 15px;font:inherit;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #5d9add;outline-offset:2px}a{color:#17528e}.meta{color:#536172;font-size:14px}li{margin-bottom:14px}.warning{padding:12px;background:#fff5db;border-radius:6px}</style></head><body><main><p class="meta">팀 업무 지식 공유 플랫폼 · 로컬 MVP</p><h1>업무 도구 연결</h1><p class="lead">커넥터를 선택해 자료를 가져옵니다.</p><p class="warning">실제 GitHub 공개 저장소의 최근 PR 최대 30개를 조회합니다. 결과는 브라우저에만 표시되며 저장되지 않습니다.</p><div class="cards" id="cards"></div><p role="status" id="status"></p><section><h2>가져온 자료</h2><ul id="results"></ul></section></main><script>
const cards=document.getElementById('cards'),status=document.getElementById('status'),results=document.getElementById('results');
async function init(){try{const r=await fetch('/api/connectors');if(!r.ok)throw Error('커넥터를 불러오지 못했습니다.');for(const c of await r.json()){const card=document.createElement('article'),h=document.createElement('h2'),form=document.createElement('form');h.textContent=c.name;card.append(h);for(const f of c.fields){const label=document.createElement('label'),input=document.createElement('input');label.textContent=f.label;input.name=f.name;input.required=f.required;input.autocomplete='off';label.append(input);form.append(label)}const button=document.createElement('button');button.textContent='자료 가져오기';form.append(button);form.addEventListener('submit',async e=>{e.preventDefault();button.disabled=true;status.textContent='자료를 가져오고 있습니다…';results.replaceChildren();try{const response=await fetch('/api/collect',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({connector:c.id,config:Object.fromEntries(new FormData(form))})});const data=await response.json();if(!response.ok)throw Error(data.error);for(const record of data.records){const li=document.createElement('li'),link=document.createElement('a'),meta=document.createElement('div');link.href=record.url;link.textContent=record.title;link.rel='noopener noreferrer';meta.className='meta';meta.textContent=record.updated_at;li.append(link,meta);results.append(li)}status.textContent=`${data.records.length}개 자료를 가져왔습니다.`}catch(err){status.textContent=err.message}finally{button.disabled=false}});card.append(form);cards.append(card)}}catch(err){status.textContent=err.message}}init();
</script></body></html>
