services:
  aws:
    build:
      context: .
      dockerfile: Dockerfile.aws-emulator
    user: "${TEAM_CONTEXT_UID:-1000}:${TEAM_CONTEXT_GID:-1000}"
    mem_limit: 2g
    ports:
      - "127.0.0.1:9297:9297"
    volumes:
      - ./.aws-emulator:/home/emulator/.aws/emulator
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --cacert /home/emulator/.aws/emulator/9297/ca.pem https://127.0.0.1:9297/__admin/health"]
      interval: 2s
      timeout: 2s
      retries: 30
