services:
  aws:
    image: localstack/localstack:3
    ports:
      - "127.0.0.1:4568:4566"
    environment:
      SERVICES: s3,dynamodb,secretsmanager,kms
      AWS_DEFAULT_REGION: us-east-1
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4566/_localstack/health"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - localstack-data:/var/lib/localstack
volumes:
  localstack-data:
