name: Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.12
      - run: uv sync --no-install-project --all-extras --python 3.12 --locked
      - name: Unit tests
        run: uv run --no-sync pytest -q
      - name: Start local AWS emulator
        run: |
          mkdir -p .aws-emulator
          TEAM_CONTEXT_UID=$(id -u) TEAM_CONTEXT_GID=$(id -g) docker compose up -d --wait
      - name: Emulator integration
        run: TEAM_CONTEXT_INTEGRATION=1 uv run --no-sync pytest -q tests/test_aws_emulator.py
      - name: Mutation tests
        run: |
          uv run --no-sync mutmut run --max-children 2
          # Re-run COA authentication mutations after the full run to avoid false kills in the forked runner.
          uv run --no-sync mutmut run --max-children 2 'local_aws.*'
          uv run --no-sync mutmut run --max-children 2 'auth.coa_identity.*'
          uv run --no-sync mutmut run --max-children 2 'auth.link_attempts.*'
          uv run --no-sync mutmut run --max-children 2 'auth.link_completion.*'
          uv run --no-sync mutmut run --max-children 2 'auth.source_credentials.*'
          uv run --no-sync mutmut run --max-children 2 'auth.source_provenance.*'
          uv run --no-sync mutmut run --max-children 2 'scripts.check_coa_gateway.*'
          uv run --no-sync mutmut export-cicd-stats
          uv run --no-sync python scripts/check_mutation.py mutants/mutmut-cicd-stats.json
      - name: Publish mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: mutants/mutmut-cicd-stats.json
          if-no-files-found: ignore
      - name: Stop local AWS emulator
        if: always()
        run: docker compose down -v
  coa-lockdown:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: aws/context-ontology-accelerator
          ref: 5dd33d7eb21d9af3de8fe4f03558eca992a4104a
          path: coa-upstream
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - name: Apply pinned COA patch
        run: git -C coa-upstream apply "$GITHUB_WORKSPACE/patches/coa-v0.3.11-gateway-only.patch"
      - name: Install COA infrastructure dependencies
        working-directory: coa-upstream
        run: pnpm install --filter 'coa-infra...' --filter 'coa-web-app...' --frozen-lockfile --ignore-scripts
      - name: Build COA shared types
        working-directory: coa-upstream
        run: pnpm --filter @coa/shared build
      - name: Test gateway-only CloudFormation synthesis
        working-directory: coa-upstream
        run: pnpm --filter coa-infra exec jest test/services/serve-stack.test.ts --runInBand --coverage=false --testNamePattern='ServeStack - gateway-only runtime'
      - name: Test gateway restriction mutations
        run: python3 tests/coa_gateway_patch_mutations.py coa-upstream
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.12
      - run: uv sync --no-install-project --all-extras --python 3.12 --locked
      - name: Apply COA MCP gateway patch
        run: git -C coa-upstream apply "$GITHUB_WORKSPACE/patches/coa-v0.3.11-mcp-gateway.patch"
      - name: Test COA MCP gateway client
        env:
          PYTHONPATH: ${{ github.workspace }}/coa-upstream/packages/mcp-server/src:${{ github.workspace }}/coa-upstream/packages/context-manager/src
        run: |
          uv run --no-sync --with 'mcp>=1.30,<2' --with 'pytest-asyncio>=0.23,<2' --with 'httpx>=0.27,<1' --with 'httpx-sse>=0.4,<1' pytest -q \
            coa-upstream/packages/mcp-server/tests/unit/test_context_manager.py \
            coa-upstream/packages/mcp-server/tests/unit/test_context_manager_timeout.py \
            coa-upstream/packages/mcp-server/tests/unit/test_server.py
      - name: Test COA MCP stack synthesis
        working-directory: coa-upstream
        run: pnpm --filter coa-infra exec jest test/services/mcp-stack.test.ts --runInBand --coverage=false
      - name: Test MCP gateway routing mutations
        run: python3 tests/coa_mcp_gateway_mutations.py coa-upstream
      - name: Apply COA data-layer gateway patch
        run: git -C coa-upstream apply "$GITHUB_WORKSPACE/patches/coa-v0.3.11-data-gateway.patch"
      - name: Test COA data-layer gateway client
        env:
          PYTHONPATH: ${{ github.workspace }}/coa-upstream/packages/data-layer/src:${{ github.workspace }}/coa-upstream/packages/context-manager/src
        run: |
          uv run --no-sync --with 'pytest-asyncio>=0.23,<2' pytest -q \
            coa-upstream/packages/data-layer/tests/unit/test_handler_validation.py \
            coa-upstream/packages/data-layer/tests/unit/test_rest_deadline_ordering.py \
            coa-upstream/packages/data-layer/tests/unit/test_contract_bounds.py
      - name: Test COA data-layer stack synthesis
        working-directory: coa-upstream
        run: pnpm --filter coa-infra exec jest test/services/data-layer-stack.test.ts --runInBand --coverage=false
      - name: Test data-layer gateway routing mutations
        run: python3 tests/coa_data_gateway_mutations.py coa-upstream
      - name: Apply COA web gateway patch
        run: git -C coa-upstream apply "$GITHUB_WORKSPACE/patches/coa-v0.3.11-web-gateway.patch"
      - name: Rebuild COA shared runtime types
        working-directory: coa-upstream
        run: pnpm --filter @coa/shared build
      - name: Test COA web gateway configuration
        working-directory: coa-upstream/infra
        run: pnpm exec jest test/foundation/web-stack.test.ts test/constructs/public-ui-csp.test.ts --runInBand --coverage=false --testNamePattern='gateway routing|configured gateway'
      - name: Test COA web gateway requests
        working-directory: coa-upstream/packages/web-app
        run: pnpm exec vitest run tests/unit/utils/build-query-endpoint.test.ts tests/unit/utils/gateway-requests.test.tsx
      - name: Test web gateway routing mutations
        run: python3 tests/coa_web_gateway_mutations.py coa-upstream
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Generate pinned COA Smithy models
        run: bash tests/prepare_coa_models.sh coa-upstream
      - name: Apply COA schema lockdown patch
        run: git -C coa-upstream apply "$GITHUB_WORKSPACE/patches/coa-v0.3.11-disable-schema.patch"
      - name: Test disabled COA schema paths
        env:
          PYTHONPATH: ${{ github.workspace }}/coa-upstream/packages/data-layer/src:${{ github.workspace }}/coa-upstream/packages/mcp-server/src:${{ github.workspace }}/coa-upstream/packages/context-manager/src
        run: |
          uv run --no-sync --with 'mcp>=1.30,<2' --with 'pytest-asyncio>=0.23,<2' --with 'httpx>=0.27,<1' --with 'httpx-sse>=0.4,<1' pytest -q \
            coa-upstream/packages/data-layer/tests/unit/test_handler_validation.py \
            coa-upstream/packages/data-layer/tests/unit/test_contract_bounds.py \
            coa-upstream/packages/data-layer/tests/unit/test_rest_deadline_ordering.py \
            coa-upstream/packages/data-layer/tests/unit/test_api_contract_conformance.py \
            coa-upstream/packages/mcp-server/tests/unit/test_server.py
      - name: Test schema lockdown stack synthesis
        working-directory: coa-upstream
        run: pnpm --filter coa-infra exec jest test/services/data-layer-stack.test.ts test/services/mcp-stack.test.ts --runInBand --coverage=false
      - name: Test schema lockdown mutations
        run: python3 tests/coa_schema_lockdown_mutations.py coa-upstream
      - name: Apply COA metric lockdown patch
        run: git -C coa-upstream apply "$GITHUB_WORKSPACE/patches/coa-v0.3.11-disable-metrics.patch"
      - name: Test disabled COA metric paths and existing validators
        env:
          PYTHONPATH: ${{ github.workspace }}/coa-upstream/packages/metric-service/src:${{ github.workspace }}/coa-upstream/packages/mcp-server/src:${{ github.workspace }}/coa-upstream/packages/context-manager/src:${{ github.workspace }}/coa-upstream/smithy-generated/control-plane-python-server
        run: |
          uv run --no-sync --with 'mcp>=1.30,<2' --with 'pytest-asyncio>=0.23,<2' --with 'httpx>=0.27,<1' --with 'httpx-sse>=0.4,<1' --with 'moto>=5,<6' --with 'opensearch-py>=2.8,<4' --with 'requests-aws4auth>=1.3,<2' --with 'sqlglot>=25,<30' --with 'pyyaml>=6,<7' --with 'rdflib>=7,<8' pytest -q \
            coa-upstream/packages/metric-service/tests/unit \
            coa-upstream/packages/mcp-server/tests/unit/test_server.py
      - name: Test metric lockdown stack synthesis
        working-directory: coa-upstream
        run: pnpm --filter coa-infra exec jest test/services/mcp-stack.test.ts --runInBand --coverage=false
      - name: Test metric lockdown mutations
        run: python3 tests/coa_metric_lockdown_mutations.py coa-upstream
      - name: Apply COA ontology proxy lockdown patch
        run: git -C coa-upstream apply "$GITHUB_WORKSPACE/patches/coa-v0.3.11-disable-ontology-proxy.patch"
      - name: Test ontology proxy lockdown synthesis
        working-directory: coa-upstream
        run: pnpm --filter coa-infra exec jest test/services/ontology-stack.test.ts --runInBand --coverage=false
      - name: Test ontology proxy lockdown mutations
        run: python3 tests/coa_ontology_lockdown_mutations.py coa-upstream
      - name: Apply COA JWT subject restriction
        run: git -C coa-upstream apply "$GITHUB_WORKSPACE/patches/coa-v0.3.11-require-jwt-subject.patch"
      - name: Test COA runtime subject restriction
        env:
          PYTHONPATH: ${{ github.workspace }}/coa-upstream/packages/context-manager/src
        run: |
          uv run --no-sync --with 'pytest-asyncio>=0.23,<2' --with 'regex==2026.5.9' --with 'bedrock-agentcore==1.18.1' --with 'httpx>=0.27,<1' --with 'opensearch-py>=2.8,<4' --with 'requests-aws4auth>=1.3,<2' --with 'sqlglot>=25,<30' --with 'cedarpy>=4.8,<5' --with 'python-ulid>=3,<4' --with 'rdflib>=7,<8' --with 'sqlalchemy[asyncio]>=2,<3' --with 'asyncpg>=0.30,<1' --with 'aiomysql>=0.2,<1' --with 'python-tds>=1.15,<2' --with 'strands-agents>=1.48,<2' --with 'retryhttp>=1.4,<2' pytest -q \
            coa-upstream/packages/context-manager/tests/unit/test_main.py \
            coa-upstream/packages/context-manager/tests/unit/test_auth.py \
            coa-upstream/packages/context-manager/tests/unit/test_session_actions.py \
            coa-upstream/packages/context-manager/tests/unit/test_authz_invariants.py \
            coa-upstream/packages/context-manager/tests/unit/test_jwt_subject_gate.py
      - name: Test JWT subject restriction mutations
        run: python3 tests/coa_jwt_subject_mutations.py coa-upstream
