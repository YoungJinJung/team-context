name: Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.12
      - run: uv sync --no-install-project --all-extras --python 3.12 --locked
      - name: Unit tests
        run: uv run --no-sync pytest -q
      - name: Start local AWS emulator
        run: docker compose up -d --wait
      - name: Emulator integration
        run: TEAM_CONTEXT_INTEGRATION=1 uv run --no-sync pytest -q tests/test_localstack.py
      - name: Mutation tests
        run: |
          uv run --no-sync mutmut run --max-children 2
          # Re-run COA authentication mutations after the full run to avoid false kills in the forked runner.
          uv run --no-sync mutmut run --max-children 2 'auth.coa_identity.*'
          uv run --no-sync mutmut run --max-children 2 'auth.link_attempts.*'
          uv run --no-sync mutmut run --max-children 2 'auth.link_completion.*'
          uv run --no-sync mutmut run --max-children 2 'auth.source_credentials.*'
          uv run --no-sync mutmut run --max-children 2 'auth.source_provenance.*'
          uv run --no-sync mutmut run --max-children 2 'scripts.check_coa_gateway.*'
          uv run --no-sync mutmut export-cicd-stats
          uv run --no-sync python scripts/check_mutation.py mutants/mutmut-cicd-stats.json
      - name: Publish mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: mutants/mutmut-cicd-stats.json
          if-no-files-found: ignore
      - name: Stop local AWS emulator
        if: always()
        run: docker compose down -v
  coa-lockdown:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: aws/context-ontology-accelerator
          ref: 5dd33d7eb21d9af3de8fe4f03558eca992a4104a
          path: coa-upstream
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - name: Apply pinned COA patch
        run: git -C coa-upstream apply "$GITHUB_WORKSPACE/patches/coa-v0.3.11-gateway-only.patch"
      - name: Install COA infrastructure dependencies
        working-directory: coa-upstream
        run: pnpm install --filter 'coa-infra...' --frozen-lockfile --ignore-scripts
      - name: Build COA shared types
        working-directory: coa-upstream
        run: pnpm --filter @coa/shared build
      - name: Test gateway-only CloudFormation synthesis
        working-directory: coa-upstream
        run: pnpm --filter coa-infra exec jest test/services/serve-stack.test.ts --runInBand --coverage=false --testNamePattern='ServeStack - gateway-only runtime'
      - name: Test gateway restriction mutations
        run: python3 tests/coa_gateway_patch_mutations.py coa-upstream
